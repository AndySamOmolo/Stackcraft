name: Build & Sign Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Android build variant (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-audit:
    name: 1. TypeScript, Curriculum, FSRS & Storage Unit Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit Production Dependencies for High/Critical CVEs
        run: npm audit --omit=dev --audit-level=high || true

      - name: Run Curriculum Schema, Chaos Physics, FSRS & Storage Unit Tests
        run: npm run audit:curriculum

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

  build-android-apk:
    name: 2. Compile & Sign Android Release APK
    needs: verify-and-audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@ab6962a2fc49fc0fef1aa8cfb6dfe0ef6cbff4a6 # v3.2.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache Gradle Wrapper & Dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Persistent Fallback Signing Keystore Across Runs
        if: env.HAS_PROD_KEYSTORE == 'false'
        env:
          HAS_PROD_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.stackcraft-keystore
          key: stackcraft-persistent-signing-keystore-v1

      - name: Install Node Dependencies
        run: npm ci --no-fund

      - name: Stamp Dynamic Android versionCode from CI Run Number
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const verCode = Math.max(1, parseInt(process.env.RUN_NUM || "1", 10));
            appJson.expo.android.versionCode = verCode;
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2) + "\n");
            console.log("Stamped android.versionCode =", verCode);
          '

      - name: Generate Native Android Directory (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle R8 Minification, ARM ABIs & JVM Heap
        run: |
          cat << 'EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          reactNativeArchitectures=arm64-v8a,armeabi-v7a
          EOF

      - name: Prepare Release Keystore & Wire Gradle Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          mkdir -p ~/.stackcraft-keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD is missing."
              exit 1
            fi
            echo "Using repository secret ANDROID_KEYSTORE_BASE64 for production signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            FALLBACK_PASS=$(printf "sc-ks-%s" "$REPO_ID" | sha256sum | cut -c1-24)
            if [ ! -f ~/.stackcraft-keystore/release.keystore ]; then
              echo "Generating persistent cached keystore for consistent APK upgrade signatures..."
              keytool -genkeypair -v \
                -storetype PKCS12 \
                -keystore ~/.stackcraft-keystore/release.keystore \
                -alias stackcraft-release \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$FALLBACK_PASS" \
                -keypass "$FALLBACK_PASS" \
                -dname "CN=StackCraft, OU=Engineering, O=StackCraft, L=Nairobi, S=Nairobi, C=KE"
            else
              echo "Reusing cached persistent keystore so APK updates install cleanly over previous builds..."
            fi
            cp ~/.stackcraft-keystore/release.keystore android/app/release.keystore
            echo "::add-mask::$FALLBACK_PASS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_KEY_ALIAS=stackcraft-release" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            if (!g.includes("MYAPP_UPLOAD_STORE_FILE")) {
              g = g.replace(
                /signingConfigs\s*\{/,
                `signingConfigs {\n        release {\n            storeFile file(System.getenv("MYAPP_UPLOAD_STORE_FILE") ?: "release.keystore")\n            storePassword System.getenv("MYAPP_UPLOAD_STORE_PASSWORD")\n            keyAlias System.getenv("MYAPP_UPLOAD_KEY_ALIAS")\n            keyPassword System.getenv("MYAPP_UPLOAD_KEY_PASSWORD")\n        }`
              );
              g = g.replace(
                /(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug/,
                "$1signingConfig signingConfigs.release"
              );
              fs.writeFileSync(p, g);
            }
          '

      - name: Compile Signed APK & AAB via Gradle
        working-directory: ./android
        env:
          MYAPP_UPLOAD_STORE_FILE: release.keystore
          BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_VARIANT" = "debug" ]; then
            ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          else
            ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          fi

      - name: Stage & Verify Signed APK/AAB Artifacts
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "$BUILD_VARIANT" = "debug" ]; then
            SRC_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            SRC_APK="android/app/build/outputs/apk/release/app-release.apk"
          fi
          cp "$SRC_APK" stackcraft-latest.apk
          cp "$SRC_APK" "stackcraft-v1.0.0-${SHORT_SHA}.apk"
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "android/app/build/outputs/bundle/release/app-release.aab" stackcraft-latest.aab
          fi
          if [ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs stackcraft-latest.apk
          fi

      - name: Upload Installable Android APK to Workflow Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: stackcraft-android-release-apk
          overwrite: true
          path: |
            stackcraft-latest.apk
            stackcraft-v1.0.0-*.apk
            stackcraft-latest.aab
          retention-days: 30

      - name: Upload APK to GitHub Releases with Zero-Downtime Asset Clobber
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SHA: ${{ github.sha }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_SHA256=$(sha256sum stackcraft-latest.apk | awk '{print $1}')
          APK_SIZE=$(du -h stackcraft-latest.apk | awk '{print $1}')
          RELEASE_TAG="latest"
          RELEASE_TITLE="StackCraft Android APK (Build #${RUN_NUM} — ${SHORT_SHA})"

          ASSETS=("stackcraft-latest.apk" "stackcraft-v1.0.0-${SHORT_SHA}.apk")
          if [ -f "stackcraft-latest.aab" ]; then
            ASSETS+=("stackcraft-latest.aab")
          fi

          NOTES="Automated Android release APK built from commit \`${SHORT_SHA}\` (Android \`versionCode: ${RUN_NUM}\`, ABIs: \`arm64-v8a, armeabi-v7a\`).

          - **Download**: \`stackcraft-latest.apk\` (${APK_SIZE})
          - **SHA-256 Checksum**: \`${APK_SHA256}\`"

          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Updating existing release '$RELEASE_TAG' in-place via --clobber..."
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$REPO" --title "$RELEASE_TITLE" --target "$SHA" --latest --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$REPO" \
              --title "$RELEASE_TITLE" \
              --target "$SHA" \
              --latest \
              --notes "$NOTES"
          fi

          if [ "$IS_TAG" = "true" ] && [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            if gh release view "$REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$REF_NAME" "${ASSETS[@]}" --repo "$REPO" --clobber
            else
              gh release create "$REF_NAME" "${ASSETS[@]}" \
                --repo "$REPO" \
                --title "StackCraft ${REF_NAME} (${SHORT_SHA})" \
                --target "$SHA" \
                --generate-notes
            fi
          fi
